name: Build Android APK (no laptop needed)
# Run from the GitHub app/website: Actions -> this workflow -> Run workflow.
# The APK appears under Actions -> this run -> Artifacts -> dubber-apk.
# For a signed release APK, add a keystore later; this debug APK installs
# directly on your own phone for testing.
on:
  workflow_dispatch:
  push:
    paths: ["android/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle :app:assembleDebug --project-dir android
      - uses: actions/upload-artifact@v4
        with:
          name: dubber-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
